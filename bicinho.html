 <head>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body style="
  background-image: url('bg.png');
  background-image: url('bgN.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
" class="bg-pink-50 min-h-screen flex flex-col">

  
  <div class="w-full flex items-center justify-start p-4 gap-4">

    <div class="avatar">
      <div class="w-16 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
        <img src="b_n.png" />
      </div>
    </div>

    <input 
      type="text" 
      placeholder="Nome da criatura..." 
      class="input input-secondary"
    />

  </div>

  
  <div class="flex flex-col items-center w-full px-4">

    <img 
      id="b"
      src="b_n.png"
      class="w-full max-w-md h-auto"
    />

    <div class="mt-12 flex justify-center w-full">

      <img 
        id="btn"
        src="btn.png"
        class="w-1/3 max-w-[180px] h-auto active:scale-95 transition cursor-pointer"
        onclick="alimentar()"
      />

    </div>

  </div>

  <script src="JavaScript.js"></script>
</body>
