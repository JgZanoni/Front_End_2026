<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Bank - Eventos</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: rgb(174, 224, 224);
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 430px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            background-color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #222;
        }

        .campo {
            background-color: white;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            background-color: white;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            background-color: white;
        }

        input:focus,
        select:focus {
            border-color: rgb(72, 150, 150);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: rgb(72, 150, 150);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: rgb(52, 120, 120);
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f5f5f5;
            line-height: 1.8;
            color: #222;
        }

        #resultado strong {
            background-color: #f5f5f5;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Crédito para Eventos</h1>

        <div class="campo">

            <label for="pacote">
                Escolha o Pacote
            </label>

            <select id="pacote">

                <option value="50">
                    Standard - R$ 50,00
                </option>

                <option value="80">
                    Premium - R$ 80,00
                </option>

                <option value="120">
                    Infinity Deluxe - R$ 120,00
                </option>

            </select>

        </div>

        <div class="campo">

            <label for="pessoas">
                Quantidade de Pessoas
            </label>

            <input 
                type="number"
                id="pessoas"
                min="1"
                placeholder="Digite a quantidade"
            >

        </div>

        <button id="calcular">
            Calcular Orçamento
        </button>

        <div id="resultado"></div>

    </div>

    <script>

        const botao = document.getElementById("calcular");

        botao.addEventListener("click", function () {

            const pacote = Number(
                document.getElementById("pacote").value
            );

            const pessoas = Number(
                document.getElementById("pessoas").value
            );

            const resultado = document.getElementById("resultado");

            const custoBruto = pacote * pessoas;

            const taxaServico = custoBruto * 0.10;

            let desconto = 0;

            if (pessoas >= 100) {

                desconto = custoBruto * 0.05;

            }

            const totalFinal = (
                custoBruto +
                taxaServico -
                desconto
            );

            resultado.innerHTML = `

                <strong>Resumo do Evento:</strong><br><br>

                Custo Bruto:
                R$ ${custoBruto.toFixed(2)}<br>

                Taxa de Serviço:
                R$ ${taxaServico.toFixed(2)}<br>

                Desconto Aplicado:
                R$ ${desconto.toFixed(2)}<br>

                <strong>
                    Total Final:
                    R$ ${totalFinal.toFixed(2)}
                </strong>

            `;

        });

    </script>

</body>
</html>
