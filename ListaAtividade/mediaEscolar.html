<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Escolar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: rgb(174, 224, 224);
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            background-color: white;
            color: #222;
        }

        .campo {
            background-color: white;
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            background-color: white;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background-color: white;
        }

        input:focus {
            border-color: rgb(72, 150, 150);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: rgb(72, 150, 150);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: rgb(52, 120, 120);
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            background-color: white;
        }

        .aprovado {
            color: blue;
        }

        .exame {
            color: green;
        }

        .reprovado {
            color: red;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Média Escolar</h1>

        <div class="campo">
            <label for="nome">Nome do Aluno</label>
            <input type="text" id="nome" placeholder="Digite o nome">
        </div>

        <div class="campo">
            <label for="nota1">Nota 1</label>
            <input type="number" id="nota1" step="0.1" placeholder="Digite a primeira nota">
        </div>

        <div class="campo">
            <label for="nota2">Nota 2</label>
            <input type="number" id="nota2" step="0.1" placeholder="Digite a segunda nota">
        </div>

        <div class="campo">
            <label for="nota3">Nota 3</label>
            <input type="number" id="nota3" step="0.1" placeholder="Digite a terceira nota">
        </div>

        <button id="calcular">
            Calcular Média
        </button>

        <div id="resultado"></div>

    </div>

    <script>

        const botao = document.getElementById("calcular");

        botao.addEventListener("click", function () {

            const nome = document.getElementById("nome").value;

            const nota1 = Number(document.getElementById("nota1").value);
            const nota2 = Number(document.getElementById("nota2").value);
            const nota3 = Number(document.getElementById("nota3").value);

            const resultado = document.getElementById("resultado");

            const media = (nota1 + nota2 + nota3) / 3;

            if (media >= 7 && media <= 10) {

                resultado.innerHTML = `
                    ${nome} está APROVADO!<br>
                    Média: ${media.toFixed(2)}
                `;
                resultado.className = "aprovado";

            }
            else if (media >= 4 && media < 7) {

                let falta = 10 - media;

                resultado.innerHTML = `
                    ${nome} está ABAIXO!<br>
                    Média: ${media.toFixed(2)}<br>
                    Faltam ${falta.toFixed(2)} pontos para chegar em 10.
                `;
                resultado.className = "exame";
            }

            else {

                resultado.innerHTML = `
                    ${nome} está REPROVADO!<br>
                    Média: ${media.toFixed(2)}
                `;
                resultado.className = "reprovado";
            }

        });

    </script>

</body>
</html>
